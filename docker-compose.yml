services:
  runtimepulse-query-api:
    build:
      context: ./query-api
      dockerfile: Dockerfile
    image: runtimepulse/query-api:dev
    container_name: runtimepulse-query-api
    ports:
      - "8081:8081"
    restart: unless-stopped

  runtimepulse-mock-node-collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: runtimepulse/mock-node-collector:dev
    container_name: runtimepulse-mock-node-collector
    depends_on:
      - runtimepulse-query-api
    environment:
      INGEST_URL: http://runtimepulse-query-api:8081/api/ingest/batch
      COLLECTOR_NODE_ID: node-a
      COLLECTOR_INTERVAL_MS: 5000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://runtimepulse-query-api:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  runtimepulse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RUNTIMEPULSE_API_BASE_URL: /api
    image: runtimepulse/frontend:dev
    container_name: runtimepulse-frontend
    depends_on:
      - runtimepulse-query-api
    ports:
      - "8080:8080"
    restart: unless-stopped
