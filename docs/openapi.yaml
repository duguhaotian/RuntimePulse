openapi: 3.1.0
info:
  title: RuntimePulse Query and Ingest API
  version: 0.1.0
  description: Query API contract for the RuntimePulse frontend plus the Phase 3 collector ingest boundary.
servers:
  - url: /api
    description: Frontend-proxied local API
  - url: http://localhost:8081/api
    description: Local Query API container
paths:
  /clusters:
    get:
      summary: List clusters
      responses:
        '200':
          description: Cluster list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterListResponse'
  /nodes:
    get:
      summary: List nodes
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'
  /nodes/{id}:
    get:
      summary: Get a node
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /images:
    get:
      summary: List images
      responses:
        '200':
          description: Image list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
  /images/{id}:
    get:
      summary: Get an image
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sandboxes:
    get:
      summary: List sandboxes
      parameters:
        - name: runtimeType
          in: query
          schema:
            $ref: '#/components/schemas/RuntimeType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SandboxStatus'
        - name: text
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Sandbox list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxListResponse'
  /sandboxes/{id}:
    get:
      summary: Get a sandbox
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sandboxes/{id}/metrics:
    get:
      summary: Get sandbox metric series
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Metric series list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeriesListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sandboxes/{id}/events:
    get:
      summary: Get sandbox events
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sandboxes/{id}/trace:
    get:
      summary: Get sandbox startup trace spans
      description: Range queries include spans whose start/end interval overlaps the requested range.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Trace span list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceSpanListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /sandboxes/{id}/profiles:
    get:
      summary: Get sandbox profile artifacts
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Profile artifact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileArtifactListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /runtimes/compare:
    get:
      summary: Compare runtime aggregate metrics
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Runtime comparison rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCompareListResponse'
  /ingest/batch:
    post:
      summary: Validate and accept a collector ingest batch
      description: Phase 3 collector contract endpoint. The current mock service validates payload shape and returns accepted counts without persisting records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatchRequest'
      responses:
        '202':
          description: Batch accepted by the ingest boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAcceptedResponse'
        '400':
          description: Invalid ingest batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ingest/status:
    get:
      summary: Get validation-only ingest status
      description: Returns in-memory ingest counters for collector smoke testing. Values reset when the Query API process restarts.
      responses:
        '200':
          description: Ingest status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStatusResponse'
  /ingest/recent:
    get:
      summary: Get recent validation-only ingest samples
      description: Returns bounded in-memory recent batches and sample rows for collector debugging. Values reset when the Query API process restarts.
      responses:
        '200':
          description: Recent ingest sample snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRecentResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RuntimeType:
      type: string
      enum: [runc, gvisor, kata, firecracker]
    SandboxStatus:
      type: string
      enum: [running, stopped, failed]
    Severity:
      type: string
      enum: [info, warning, error]
    RuntimeGroup:
      type: string
      enum: [cpu, memory, io, network, runtime, startup, pressure]
    NodeStatus:
      type: string
      enum: [ready, degraded, unknown]
    LoadingMode:
      type: string
      enum: [lazy, eager]
    ImageDownloadPhase:
      type: string
      enum: [resolve, pull, verify, unpack, snapshot]
    ProfileType:
      type: string
      enum: [cpu, off_cpu, memory, block_io, syscall]
    TraceStatus:
      type: string
      enum: [ok, error]
    JsonObject:
      type: object
      additionalProperties: true
    Cluster:
      type: object
      required: [id, name, environment]
      properties:
        id: { type: string }
        name: { type: string }
        environment: { type: string }
    Node:
      type: object
      required: [id, name, clusterId, kernelVersion, cpuCores, memoryBytes, status]
      properties:
        id: { type: string }
        name: { type: string }
        clusterId: { type: string }
        kernelVersion: { type: string }
        cpuCores: { type: integer }
        memoryBytes: { type: number }
        status:
          $ref: '#/components/schemas/NodeStatus'
    ImageLayer:
      type: object
      required: [id, command, sizeBytes, blockSizeBytes, blockCount, requestedBlockCount, cacheHitBlockCount, localReadBytes, remoteReadBytes, pullDurationMs, unpackDurationMs]
      properties:
        id: { type: string }
        command: { type: string }
        sizeBytes: { type: number }
        blockSizeBytes: { type: number }
        blockCount: { type: integer }
        requestedBlockCount: { type: integer }
        cacheHitBlockCount: { type: integer }
        localReadBytes: { type: number }
        remoteReadBytes: { type: number }
        pullDurationMs: { type: number }
        unpackDurationMs: { type: number }
    ImageDownloadStep:
      type: object
      required: [id, name, phase, durationMs, detail]
      properties:
        id: { type: string }
        name: { type: string }
        phase:
          $ref: '#/components/schemas/ImageDownloadPhase'
        durationMs: { type: number }
        bytes: { type: number }
        detail: { type: string }
    Image:
      type: object
      required: [id, ref, digest, loadingMode, sizeBytes, layerCount]
      properties:
        id: { type: string }
        ref: { type: string }
        digest: { type: string }
        loadingMode:
          $ref: '#/components/schemas/LoadingMode'
        sizeBytes: { type: number }
        layerCount: { type: integer }
        layers:
          type: array
          items:
            $ref: '#/components/schemas/ImageLayer'
        downloadTimeline:
          type: array
          items:
            $ref: '#/components/schemas/ImageDownloadStep'
    Sandbox:
      type: object
      required: [id, clusterId, nodeId, namespace, workloadId, workloadName, imageId, imageRef, runtimeType, runtimeVersion, status, createdAt, startupDurationMs, cpuAvg, memoryPeakBytes, eventCount, labels, attributes]
      properties:
        id: { type: string }
        clusterId: { type: string }
        nodeId: { type: string }
        namespace: { type: string }
        workloadId: { type: string }
        workloadName: { type: string }
        imageId: { type: string }
        imageRef: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        runtimeVersion: { type: string }
        status:
          $ref: '#/components/schemas/SandboxStatus'
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time }
        startupDurationMs: { type: number }
        cpuAvg: { type: number }
        memoryPeakBytes: { type: number }
        eventCount: { type: integer }
        labels:
          type: object
          additionalProperties:
            type: string
        attributes:
          $ref: '#/components/schemas/JsonObject'
    MetricPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number }
    MetricSeries:
      type: object
      required: [id, name, label, unit, group, points]
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string }
        unit: { type: string }
        group:
          $ref: '#/components/schemas/RuntimeGroup'
        sandboxId: { type: string }
        nodeId: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
    EventRecord:
      type: object
      required: [id, timestamp, severity, eventType, eventName, message, source, attributes]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        severity:
          $ref: '#/components/schemas/Severity'
        eventType: { type: string }
        eventName: { type: string }
        sandboxId: { type: string }
        nodeId: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        reason: { type: string }
        message: { type: string }
        source: { type: string }
        attributes:
          $ref: '#/components/schemas/JsonObject'
    TraceSpan:
      type: object
      required: [traceId, spanId, sandboxId, spanName, startTime, endTime, durationMs, status, attributes]
      properties:
        traceId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: string }
        sandboxId: { type: string }
        spanName: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationMs: { type: number }
        status:
          $ref: '#/components/schemas/TraceStatus'
        attributes:
          $ref: '#/components/schemas/JsonObject'
    FlamegraphFrame:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }
        children:
          type: array
          items:
            $ref: '#/components/schemas/FlamegraphFrame'
    ProfileArtifact:
      type: object
      required: [id, timestamp, sandboxId, profileType, processRole, durationMs, sampleCount, objectUri]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        sandboxId: { type: string }
        profileType:
          $ref: '#/components/schemas/ProfileType'
        processRole: { type: string }
        durationMs: { type: number }
        sampleCount: { type: integer }
        objectUri: { type: string }
        flamegraph:
          $ref: '#/components/schemas/FlamegraphFrame'
    RuntimeCompareRow:
      type: object
      required: [runtimeType, sampleCount, startupP50Ms, startupP95Ms, cpuOverheadRatio, memoryOverheadBytes, failureRate]
      properties:
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        sampleCount: { type: integer }
        startupP50Ms: { type: number }
        startupP95Ms: { type: number }
        cpuOverheadRatio: { type: number }
        memoryOverheadBytes: { type: number }
        failureRate: { type: number }
    IngestMetadata:
      type: object
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        images:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        sandboxes:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
    IngestMetricSample:
      type: object
      required: [timestamp, name, value]
      properties:
        timestamp: { type: string, format: date-time }
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        group: { type: string }
        sandboxId: { type: string }
        nodeId: { type: string }
        imageId: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        attributes:
          $ref: '#/components/schemas/JsonObject'
    IngestBatchRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: Collector identity, such as node-agent/node-a or containerd-collector.
        observedAt:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/IngestMetadata'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/IngestMetricSample'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRecord'
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceSpan'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileArtifact'
    IngestCounts:
      type: object
      required: [metadata, metrics, events, traces, profiles]
      properties:
        metadata:
          type: object
          required: [clusters, nodes, images, sandboxes]
          properties:
            clusters: { type: integer }
            nodes: { type: integer }
            images: { type: integer }
            sandboxes: { type: integer }
        metrics: { type: integer }
        events: { type: integer }
        traces: { type: integer }
        profiles: { type: integer }
    IngestAccepted:
      type: object
      required: [status, mode, counts]
      properties:
        status:
          type: string
          enum: [accepted]
        mode:
          type: string
          enum: [validation_only]
        counts:
          $ref: '#/components/schemas/IngestCounts'
    IngestBatchSummary:
      type: object
      required: [source, acceptedAt, counts]
      properties:
        source: { type: string }
        observedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        counts:
          $ref: '#/components/schemas/IngestCounts'
    IngestRejectedSummary:
      type: object
      required: [rejectedAt, errors]
      properties:
        source: { type: string }
        rejectedAt: { type: string, format: date-time }
        errors:
          type: array
          items:
            type: string
    IngestSourceStatus:
      type: object
      required: [source, acceptedBatches, totals, firstAcceptedAt, lastAcceptedAt]
      properties:
        source: { type: string }
        acceptedBatches: { type: integer }
        totals:
          $ref: '#/components/schemas/IngestCounts'
        firstAcceptedAt: { type: string, format: date-time }
        lastAcceptedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
    LiveStoreStatus:
      type: object
      required: [clusters, nodes, images, sandboxes, metricSeries, metricPoints, events, traces, profiles, limits]
      properties:
        clusters: { type: integer }
        nodes: { type: integer }
        images: { type: integer }
        sandboxes: { type: integer }
        metricSeries: { type: integer }
        metricPoints: { type: integer }
        events: { type: integer }
        traces: { type: integer }
        profiles: { type: integer }
        lastUpdatedAt: { type: string, format: date-time }
        limits:
          type: object
          required: [metricPointsPerSeries, rowsPerKind]
          properties:
            metricPointsPerSeries: { type: integer }
            rowsPerKind: { type: integer }
    IngestStatus:
      type: object
      required: [mode, startedAt, acceptedBatches, rejectedBatches, totals, sources]
      properties:
        mode:
          type: string
          enum: [validation_only]
        startedAt: { type: string, format: date-time }
        acceptedBatches: { type: integer }
        rejectedBatches: { type: integer }
        totals:
          $ref: '#/components/schemas/IngestCounts'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/IngestSourceStatus'
        liveStore:
          $ref: '#/components/schemas/LiveStoreStatus'
        lastAcceptedBatch:
          $ref: '#/components/schemas/IngestBatchSummary'
        lastRejectedBatch:
          $ref: '#/components/schemas/IngestRejectedSummary'
    RecentMetricSample:
      type: object
      required: [source, acceptedAt, timestamp, name, value]
      properties:
        source: { type: string }
        acceptedAt: { type: string, format: date-time }
        timestamp: { type: string, format: date-time }
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        group: { type: string }
        sandboxId: { type: string }
        nodeId: { type: string }
        imageId: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        attributes:
          $ref: '#/components/schemas/JsonObject'
    RecentEventSample:
      type: object
      required: [source, acceptedAt, id, timestamp, severity, eventType, eventName, message]
      properties:
        source: { type: string }
        acceptedAt: { type: string, format: date-time }
        id: { type: string }
        timestamp: { type: string, format: date-time }
        severity:
          $ref: '#/components/schemas/Severity'
        eventType: { type: string }
        eventName: { type: string }
        sandboxId: { type: string }
        nodeId: { type: string }
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        message: { type: string }
    RecentTraceSample:
      type: object
      required: [source, acceptedAt, traceId, spanId, spanName, startTime, endTime, durationMs, status]
      properties:
        source: { type: string }
        acceptedAt: { type: string, format: date-time }
        traceId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: string }
        sandboxId: { type: string }
        spanName: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationMs: { type: number }
        status:
          $ref: '#/components/schemas/TraceStatus'
    RecentProfileSample:
      type: object
      required: [source, acceptedAt, id, timestamp, sandboxId, profileType, processRole, durationMs, sampleCount, objectUri]
      properties:
        source: { type: string }
        acceptedAt: { type: string, format: date-time }
        id: { type: string }
        timestamp: { type: string, format: date-time }
        sandboxId: { type: string }
        profileType:
          $ref: '#/components/schemas/ProfileType'
        processRole: { type: string }
        durationMs: { type: number }
        sampleCount: { type: integer }
        objectUri: { type: string }
    IngestRecent:
      type: object
      required: [mode, recentBatches, recentMetrics, recentEvents, recentTraces, recentProfiles]
      properties:
        mode:
          type: string
          enum: [validation_only]
        recentBatches:
          type: array
          items:
            $ref: '#/components/schemas/IngestBatchSummary'
        recentMetrics:
          type: array
          items:
            $ref: '#/components/schemas/RecentMetricSample'
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/RecentEventSample'
        recentTraces:
          type: array
          items:
            $ref: '#/components/schemas/RecentTraceSample'
        recentProfiles:
          type: array
          items:
            $ref: '#/components/schemas/RecentProfileSample'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        details:
          type: array
          items:
            type: string
    ClusterListResponse:
      $ref: '#/components/schemas/DataResponse_ClusterArray'
    NodeListResponse:
      $ref: '#/components/schemas/DataResponse_NodeArray'
    NodeResponse:
      $ref: '#/components/schemas/DataResponse_Node'
    ImageListResponse:
      $ref: '#/components/schemas/DataResponse_ImageArray'
    ImageResponse:
      $ref: '#/components/schemas/DataResponse_Image'
    SandboxListResponse:
      $ref: '#/components/schemas/DataResponse_SandboxArray'
    SandboxResponse:
      $ref: '#/components/schemas/DataResponse_Sandbox'
    MetricSeriesListResponse:
      $ref: '#/components/schemas/DataResponse_MetricSeriesArray'
    EventListResponse:
      $ref: '#/components/schemas/DataResponse_EventRecordArray'
    TraceSpanListResponse:
      $ref: '#/components/schemas/DataResponse_TraceSpanArray'
    ProfileArtifactListResponse:
      $ref: '#/components/schemas/DataResponse_ProfileArtifactArray'
    RuntimeCompareListResponse:
      $ref: '#/components/schemas/DataResponse_RuntimeCompareRowArray'
    IngestAcceptedResponse:
      $ref: '#/components/schemas/DataResponse_IngestAccepted'
    IngestStatusResponse:
      $ref: '#/components/schemas/DataResponse_IngestStatus'
    IngestRecentResponse:
      $ref: '#/components/schemas/DataResponse_IngestRecent'
    DataResponse_ClusterArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
    DataResponse_NodeArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Node'
    DataResponse_Node:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Node'
    DataResponse_ImageArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Image'
    DataResponse_Image:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Image'
    DataResponse_SandboxArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sandbox'
    DataResponse_Sandbox:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Sandbox'
    DataResponse_MetricSeriesArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
    DataResponse_EventRecordArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventRecord'
    DataResponse_TraceSpanArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TraceSpan'
    DataResponse_ProfileArtifactArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfileArtifact'
